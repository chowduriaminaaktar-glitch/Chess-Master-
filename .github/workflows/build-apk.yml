name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with this build'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Version tag for release (e.g., v1.0.0, optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment & Keystore
        run: |
          echo "Setting up keystore and configuration..."
          # Restore debug.keystore from base64 if present, or generate one
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully decoded debug.keystore"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keypass android -storepass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

          # Ensure .env exists for the secrets gradle plugin
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
            echo "Created .env configuration file"
          fi

          # Ensure Gradle wrapper script is executable
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify & Prepare APK Artifact
        id: verify-apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not generated at expected path: $APK_PATH"
            find app/build/outputs/ -type f || true
            exit 1
          fi

          # Copy to user-friendly name for download
          cp "$APK_PATH" Chess-Nova.apk
          FILE_SIZE=$(ls -lh Chess-Nova.apk | awk '{print $5}')
          echo "APK successfully built: Chess-Nova.apk ($FILE_SIZE)"
          echo "apk_path=Chess-Nova.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Nova-APK
          path: Chess-Nova.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('v1.0.{0}', github.run_number)) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('Release v1.0.{0}', github.run_number)) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: Chess-Nova.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
